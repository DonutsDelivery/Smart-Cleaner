name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Verify binary
        run: ls -la target/release/donutcleaner

      - name: Package tarball
        run: |
          mkdir -p dist/donutcleaner
          cp target/release/donutcleaner dist/donutcleaner/
          cp data/online.donutsdelivery.DonutCleaner.desktop dist/donutcleaner/
          cp data/online.donutsdelivery.DonutCleaner.metainfo.xml dist/donutcleaner/
          cp data/online.donutsdelivery.DonutCleaner.policy dist/donutcleaner/
          cp icons/online.donutsdelivery.DonutCleaner.svg dist/donutcleaner/
          cp -r icons/hicolor dist/donutcleaner/
          cp README.md LICENSE dist/donutcleaner/
          cd dist && tar czf ../donutcleaner-x86_64.tar.gz donutcleaner

      - name: Package standalone binary
        run: cp target/release/donutcleaner donutcleaner-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            donutcleaner-x86_64.tar.gz
            donutcleaner-x86_64
