[package]
name = "donutcleaner"
version = "0.1.0"
edition = "2024"
description = "Clean caches and remove unused packages on Linux"
license = "MIT"
repository = "https://github.com/DonutsDelivery/Smart-Cleaner"

[[bin]]
name = "donutcleaner"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
which = "7"
bytesize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
